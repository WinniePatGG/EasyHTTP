name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile, test and assemble
        run: ./gradlew build

  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Determine next version
        id: version
        env:
          BASELINE: '1.0'
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          if [ -z "$latest" ]; then
            current="$BASELINE"
          else
            current="${latest#v}"
          fi
          major="${current%%.*}"
          minor="${current##*.}"
          version="${major}.$(( minor + 1 ))"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "Latest tag: ${latest:-<none>}"
          echo "Publishing version: ${version}"

      - name: Write publishing credentials
        env:
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_TOKEN_VALUE: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.gradle"
          {
            echo "reposilite.username=${REPOSILITE_USERNAME}"
            echo "reposilite.password=${REPOSILITE_PASSWORD}"
            echo "gpr.user=${GITHUB_ACTOR_NAME}"
            echo "gpr.key=${GITHUB_TOKEN_VALUE}"
          } >> "${HOME}/.gradle/gradle.properties"

      - name: Publish to reposilite and GitHub Packages
        run: ./gradlew publish -Pversion=${{ steps.version.outputs.version }}

      - name: Tag release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG#v}"
          git push origin "refs/tags/${TAG}"
